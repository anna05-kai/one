<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новая запись</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 700px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 {
    color: #0b2a5b;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .subtitle { color: #7fb6d9; font-size: 15px; margin-bottom: 28px; }
  textarea {
    width: 100%;
    min-height: 300px;
    border: 1px solid #dceaf4;
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 17px;
    font-family: inherit;
    color: #1a1a1a;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background: #ffffff;
  }
  textarea:focus {
    border-color: #0b2a5b;
    box-shadow: 0 0 0 3px rgba(11, 42, 91, 0.08);
  }
  textarea::placeholder { color: #a9cde4; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 26px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.06s ease;
  }
  .btn-save { background: #0b2a5b; color: #fff; }
  .btn-save:hover { background: #0f3670; }
  .btn-save:active { transform: scale(0.98); }
  .btn-save:disabled { background: #8fa6c4; cursor: default; }
  .btn-cancel { background: #eef6fb; color: #2b6a94; }
  .btn-cancel:hover { background: #e2f0f9; }
  .link-row {
    display: none;
    margin-top: 22px;
    padding: 14px 16px;
    border: 1px solid #dceaf4;
    border-radius: 10px;
    background: #f7fbfe;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .link-row.show { display: flex; }
  .link-row .link-label {
    color: #7fb6d9;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .link-row a {
    color: #0b2a5b;
    font-size: 14px;
    text-decoration: none;
    word-break: break-all;
    flex: 1;
  }
  .link-row a:hover { text-decoration: underline; }
  .btn-copy {
    background: #0b2a5b;
    color: #fff;
    padding: 9px 18px;
    font-size: 14px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .btn-copy:hover { background: #0f3670; }
  .status {
    margin-top: 12px;
    font-size: 14px;
    color: #2e7d32;
    opacity: 0;
    transition: opacity 0.3s ease;
    text-align: right;
  }
  .status.show { opacity: 1; }
</style>
</head>
<body>
  <div class="container">
    <h1>Новая запись</h1>
    <p class="subtitle">Напишите что-нибудь и нажмите «Сохранить»</p>

    <form id="noteForm">
      <textarea id="noteText" placeholder="Введите текст…"></textarea>

      <div class="actions">
        <button type="button" class="btn-cancel" id="cancelBtn">Отмена</button>
        <button type="submit" class="btn-save" id="saveBtn">Сохранить</button>
      </div>

      <div class="link-row" id="linkRow">
        <span class="link-label">Ссылка</span>
        <a id="linkAnchor" href="#" target="_blank" rel="noopener"></a>
        <button type="button" class="btn-copy" id="copyBtn">Скопировать ссылку</button>
      </div>

      <div class="status" id="status"></div>
    </form>
  </div>

<script>
  /* ======== НАСТРОЙКА EXTENDSCLASS ======== */
  const BIN_ID  = 'f3e931f7155a';
  const API_URL = `https://json.extendsclass.com/bin/${BIN_ID}`;
  /* ======================================== */

  const form       = document.getElementById('noteForm');
  const textarea   = document.getElementById('noteText');
  const status     = document.getElementById('status');
  const cancelBtn  = document.getElementById('cancelBtn');
  const saveBtn    = document.getElementById('saveBtn');
  const linkRow    = document.getElementById('linkRow');
  const linkAnchor = document.getElementById('linkAnchor');
  const copyBtn    = document.getElementById('copyBtn');

  function showStatus(msg, ok = true) {
    status.textContent = msg;
    status.style.color = ok ? '#2e7d32' : '#c62828';
    status.classList.add('show');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => status.classList.remove('show'), 3000);
  }

  function makeId(len = 10) {
    const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    return [...arr].map(n => chars[n % chars.length]).join('');
  }

  // Читаем все заметки. ExtendsClass хранит то, что мы в него положили.
  // Если это массив — вернём его. Если пусто — пустой массив.
  async function fetchStore() {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (res.status === 404) return [];
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }

  // Добавляем одну заметку через PATCH (JSON Merge Patch).
  // PATCH не стирает массив, а добавляет в него элемент.
  async function addNote(note) {
    const res = await fetch(API_URL, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/merge-patch+json'
      },
      // JSON Merge Patch: добавляем в массив новую запись
      body: JSON.stringify([note])
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  }

  // ---- сохранение ----
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = textarea.value.trim();
    if (!text) { showStatus('Введите текст перед сохранением', false); return; }

    const id = makeId(10);
    saveBtn.disabled = true;

    try {
      showStatus('Сохраняем…');

      // Сначала проверяем, есть ли вообще данные в бине.
      // Если это первый запуск и бин пустой (не массив) — создаём массив.
      let items = [];
      try {
        items = await fetchStore();
      } catch (err) {
        // если бина ещё нет или он пустой — начнём с пустого массива
        items = [];
      }

      const newNote = { id, text, created: Date.now() };

      if (items.length === 0) {
        // Первая запись — кладём весь массив через PUT
        const res = await fetch(API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify([newNote])
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
      } else {
        // Последующие — через PATCH, добавляем в конец
        await addNote(newNote);
      }

      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';
      url.searchParams.set('id', id);

      linkAnchor.textContent = url.toString();
      linkAnchor.href = url.toString();
      linkRow.classList.add('show');
      showStatus('Текст сохранён ✓');
    } catch (err) {
      console.error(err);
      showStatus('Ошибка сохранения. Попробуйте ещё раз.', false);
    } finally {
      saveBtn.disabled = false;
    }
  });

  // ---- копирование ссылки ----
  copyBtn.addEventListener('click', async () => {
    const link = linkAnchor.href;
    if (!link || link === '#') return;
    try {
      await navigator.clipboard.writeText(link);
      showStatus('Ссылка скопирована ✓');
    } catch {
      const tmp = document.createElement('input');
      tmp.value = link;
      document.body.appendChild(tmp);
      tmp.select();
      document.execCommand('copy');
      tmp.remove();
      showStatus('Ссылка скопирована ✓');
    }
  });

  // ---- отмена ----
  cancelBtn.addEventListener('click', () => {
    textarea.value = '';
    linkRow.classList.remove('show');
    status.classList.remove('show');
    textarea.focus();
  });

  // ---- загрузка по ?id= ----
  (async function loadFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) return;

    try {
      const items = await fetchStore();
      const rec = items.find(r => r.id === id);
      if (!rec) { showStatus('Запись не найдена', false); return; }

      textarea.value = rec.text;
      const url = new URL(window.location.href);
      linkAnchor.textContent = url.toString();
      linkAnchor.href = url.toString();
      linkRow.classList.add('show');
      showStatus('Запись загружена');
    } catch (err) {
      console.error(err);
      showStatus('Не удалось прочитать запись', false);
    }
  })();
</script>
</body>
</html>
